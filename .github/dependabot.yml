# Run dependencies versions update
version: 2

# Multi-ecosystem group: all version updates land in a single combined PR.
# Security updates are alert-driven and unaffected by this grouping; the uv
# `security-updates` group below keeps them batched in their own PR.
multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/examples/*/"
    commit-message:
      prefix: "chore(deps)"
    patterns:
      - "*"
    multi-ecosystem-group: "all"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    patterns:
      - "*"
    multi-ecosystem-group: "all"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all"
