name: License Check

# Runs on every pull request regardless of which files were changed.
# Enforces four rules:
#   Rule 1 - NVIDIA copyright lines in base files must be retained verbatim.
#   Rule 2 - Modified upstream files (had NVIDIA copyright) must add Intel
#            copyright and the "modified by Intel" notice.
#   Rule 3 - Brand-new .py files must carry the Intel header.
#   Rule 4 - The root LICENSE file must not be altered or deleted.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to compare against (default: main)"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Fetch base branch
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: |
          BASE="${GITHUB_BASE_REF:-${INPUT_BASE_REF:-'main'}}"
          git fetch origin "${BASE}"
          echo "TORCH_TWEAK_LICENSE_CHECKER_BASE_REF=${BASE}" >> "$GITHUB_ENV"

      - name: Run license checker
        run: python .github/scripts/check_licenses.py
