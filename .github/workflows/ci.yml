name: CI

# Run all checks and tests for Torch Tweak.
# Run workflow on push to main and on pull requests.
# All tests (on GPU card and on CPU) are run if relevant changes
# are detected, and all checks have passed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/reusable_checks.yml
    permissions:
      contents: read
      # CodeQL results upload.
      security-events: write
      actions: read

  packaging:
    name: Packaging
    needs: checks
    uses: ./.github/workflows/reusable_packaging.yml

  tests:
    name: Tests (GPU)
    needs: checks
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak' && needs.checks.outputs.run_gpu_tests == 'true'
    uses: ./.github/workflows/reusable_tests_gpu.yml

  tests-cpu:
    name: Tests (CPU)
    needs: checks
    uses: ./.github/workflows/reusable_tests_cpu.yml

  coverage:
    name: Coverage
    needs: [tests, tests-cpu]
    permissions:
      contents: read
      # Needed to find and download the baseline report from the latest successful run on main.
      actions: read
    secrets:
      BB_GIST_TOKEN: ${{ secrets.BB_GIST_TOKEN }}
    uses: ./.github/workflows/reusable_coverage.yml
    with:
      event_name: ${{ github.event_name }}
      pull_request_base_sha: ${{ github.event.pull_request.base.sha }}
