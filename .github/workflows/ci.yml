name: CI

# Run all checks and tests for Torch Tweak.
# Tests (on BMG card) are only run if relevant changes are detected
# and all checks have passed.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/reusable_checks.yml
    permissions:
      contents: read
      # CodeQL results upload.
      security-events: write
      actions: read

  packaging:
    name: Packaging
    needs: checks
    uses: ./.github/workflows/reusable_packaging.yml

  tests:
    name: Tests
    needs: checks
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak' && needs.checks.outputs.run_tests == 'true'
    uses: ./.github/workflows/reusable_tests.yml

  tests-cpu:
    name: Tests (CPU)
    needs: lint
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      COVERAGE_RCFILE: ${{ github.workspace }}/torch-tweak/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/torch-tweak/.coverage

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak

      # Same Python as the XPU job, see the TODO there.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Torch Tweak with the CPU build of PyTorch
        working-directory: torch-tweak
        run: uv sync --locked --no-default-groups --group cpu --extra torchao --extra dev

      - name: Run unit tests and library doctests
        env:
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: uv run --no-sync coverage run -m pytest -v -m "not functional and not nightly"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-cpu
          path: torch-tweak/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    needs: [tests, tests-cpu]
    permissions:
      contents: read
      # Needed to find and download the baseline report from the latest successful run on main.
      actions: read
    secrets:
      BB_GIST_TOKEN: ${{ secrets.BB_GIST_TOKEN }}
