name: CI

# Run all checks and tests for Torch Tweak.
# Tests (on BMG card) are only run if relevant changes are detected
# and all checks have passed.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      # CodeQL results upload.
      security-events: write
      actions: read
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # dev includes all deps (including pre-commit);
      # we also build tt itself as it is needed for the API docs.
      - name: Install dev dependencies
        run: uv sync --extra dev --no-default-groups

      - name: Check tool version pins
        run: |
          # Make sure the ruff version pinned in pyproject.toml matches the one in .pre-commit-config.yaml
          ruff_pin=$(python3 -c 'import pathlib,re; m=re.search(r"ruff==([0-9.]+)", pathlib.Path("pyproject.toml").read_text()); print(m.group(1) if m else "")')
          ruff_rev=$(python3 -c 'import pathlib,re; m=re.search(r"astral-sh/ruff-pre-commit.*?rev:\s*v(\S+)", pathlib.Path(".pre-commit-config.yaml").read_text(), re.S); print(m.group(1) if m else "")')
          if [ -z "$ruff_pin" ] || [ "$ruff_pin" != "$ruff_rev" ]; then
            echo "ruff pin '${ruff_pin:-missing}' != pre-commit rev '${ruff_rev:-missing}'"
            exit 1
          fi

      - name: Run pre-commit
        env:
          # Branch guard; irrelevant when validating files in CI (e.g. push to main).
          SKIP: no-commit-to-branch
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            uv run --no-sync pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
          else
            uv run --no-sync pre-commit run --all-files --show-diff-on-failure
          fi

      # Rules are relative to the PR base, so there is nothing to check on push.
      - name: Run license checker
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          TORCH_TWEAK_LICENSE_CHECKER_BASE_REF="${GITHUB_BASE_REF}" python .github/scripts/check_licenses.py

      - name: Build docs
        run: uv run --no-sync properdocs build --strict

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions, python
          # Outputs of the previous steps.
          config: |
            paths-ignore:
              - .venv
              - site

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Detect changes that need GPU tests
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ -z "${BASE_SHA}" ] \
              || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
              || ! changed="$(git diff --name-only "${BASE_SHA}" HEAD)"; then
            run=true
          elif printf '%s\n' "${changed}" | grep -Eq \
              '^(torch_tweak/|examples/|tests/|pyproject\.toml$|conftest\.py$|uv\.lock$|\.github/workflows/ci\.yml$|\.github/scripts/coverage_summary\.py$)'; then
            run=true
          else
            run=false
            echo "No relevant changes detected; skipping GPU tests."
          fi
          echo "run_tests=${run}" >> "${GITHUB_OUTPUT}"

  packaging:
    name: Packaging
    needs: checks
    uses: ./.github/workflows/packaging.yml

  tests:
    name: Tests
    needs: checks
    runs-on: [BMG]
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak' && needs.checks.outputs.run_tests == 'true'
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: >-
        --device=/dev/dri
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
    env:
      # Shared by tests and examples (which run in their own venvs), so all data lands in one place.
      COVERAGE_RCFILE: ${{ github.workspace }}/torch-tweak/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/torch-tweak/.coverage

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install drivers and required packages
        run: |
          # extra proxy inherited to docker has to be removed
          unset no_proxy
          unset NO_PROXY

          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:kobuk-team/intel-graphics
          apt-get update -y
          apt-get install -y \
            build-essential \
            clinfo \
            git \
            hwinfo \
            intel-gsc \
            intel-media-va-driver-non-free \
            intel-metrics-discovery \
            intel-ocloc \
            intel-opencl-icd \
            libmfx-gen1 \
            libva-glx2 \
            libvpl2 \
            libvpl-tools \
            libze1 \
            libze-dev \
            libze-intel-gpu1 \
            va-driver-all \
            vainfo

      # Install xpu (important!) and dev dependencies (they include tests' deps plus extras for CI).
      - name: Install Torch Tweak
        working-directory: torch-tweak
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

          uv sync --extra xpu --extra dev

      - name: Run unit tests and library doctests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          # Uses [tool.pytest.ini_options] testpaths and --doctest-modules from pyproject.toml.
          uv run coverage run -m pytest -v -m "not functional and not nightly"

      - name: Run functional tests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          uv run coverage run -m pytest -m functional

      # Examples call their console scripts' modules directly, so coverage.py can wrap them.
      - name: Run examples
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        working-directory: torch-tweak
        run: |
          echo "::group::minimal"
          uv run coverage run examples/Minimal/demo.py
          echo "::endgroup::"

          echo "::group::llm"
          cd examples/LLM
          uv sync --group coverage
          uv run coverage run -m llm.tune --model_id microsoft/Phi-3-mini-4k-instruct
          uv run coverage run -m llm.benchmark --model_id microsoft/Phi-3-mini-4k-instruct --sequence_lengths "128,1024"
          cd -
          echo "::endgroup::"

          echo "::group::e5large"
          cd examples/E5Large
          uv sync --group coverage
          uv run coverage run -m e5large.tune
          uv run coverage run -m e5large.inference --prompt "query: What is the capital city of France?"
          cd -
          echo "::endgroup::"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: torch-tweak/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Debug CI platform information
        if: ${{ always() }}
        run: ./torch-tweak/.github/scripts/get_system_info.sh

  coverage:
    name: Coverage
    needs: tests
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      # Needed to find and download the baseline report from the latest successful run on main.
      actions: read

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs the PR base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage-data

      # Only coverage and diff-cover from uv.lock; the project itself and torch are not needed here.
      - name: Install coverage tools
        run: uv sync --locked --only-group coverage

      - name: Combine coverage data and build reports
        run: |
          uv run --no-sync coverage combine coverage-data/
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage html -d htmlcov
          uv run --no-sync coverage report --skip-covered --sort=cover

      # On main this artifact becomes the baseline for subsequent PRs.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            htmlcov/
          retention-days: 90

      - name: Download baseline coverage from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs that skipped GPU tests (no relevant changes) have no report, so take the newest one that does.
          found=false
          while read -r run_id head_sha; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage-report --dir baseline; then
              echo "label=main @ ${head_sha:0:7}" >> "$GITHUB_OUTPUT"
              found=true
              break
            fi
          done < <(gh run list \
            --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
            --limit 20 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"' || true)
          if [ "$found" != true ]; then
            echo "::warning title=Coverage::No baseline coverage report found on main"
          fi

      - name: Measure coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-sync diff-cover coverage.xml \
            --compare-branch "$BASE_SHA" \
            --include 'torch_tweak/**' \
            --format json:diff-cover.json,markdown:diff-cover.md

      # Threshold to fail PR if total line coverage drops by: 5%
      - name: Publish coverage summary
        id: summary
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          FAIL_THRESHOLD_PARAM: ${{ github.event_name == 'pull_request' && '--fail-threshold 5' || '' }}
        run: |
          python .github/scripts/coverage_summary.py \
            --current coverage.json \
            --baseline baseline/coverage.json \
            --baseline-label "${BASELINE_LABEL:-main}" \
            --diff-cover diff-cover.json \
            --diff-cover-markdown diff-cover.md \
            ${FAIL_THRESHOLD_PARAM}

          # Export value of the code coverage %, rounded up to 2 decimal places
          export COV_OUT=$(python -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2))')
          echo "calculated coverage=${COV_OUT}\%"
          echo "COV_OUT=$COV_OUT" >> $GITHUB_OUTPUT

      # Only update the badge on push (event is passed only for total coverage)
      - name: Update coverage badge
        if: ${{ success() && github.event_name == 'push' }}
        uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.BB_GIST_TOKEN }}
          gistID: cfa745c6e219d84dec39841a981daea7
          filename: tt_coverage_badge.svg
          label: Coverage
          message: ${{ steps.summary.outputs.COV_OUT }}%
          valColorRange: ${{ steps.summary.outputs.COV_OUT }}
          minColorRange: 50 # if <= this value = color: red
          maxColorRange: 90 # if >= this value = color: green
