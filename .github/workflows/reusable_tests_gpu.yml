name: Tests (GPU)

# Run unit and functional tests, and examples on the BMG GPU; uploads the coverage data.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (GPU)
    runs-on: [BMG]
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: >-
        --device=/dev/dri
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
    env:
      # Shared by tests and examples (which run in their own venvs), so all data lands in one place.
      COVERAGE_RCFILE: ${{ github.workspace }}/torch-tweak/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/torch-tweak/.coverage

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install drivers and required packages
        run: |
          # extra proxy inherited to docker has to be removed
          unset no_proxy
          unset NO_PROXY

          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:kobuk-team/intel-graphics
          apt-get update -y
          apt-get install -y \
            build-essential \
            clinfo \
            git \
            hwinfo \
            intel-gsc \
            intel-media-va-driver-non-free \
            intel-metrics-discovery \
            intel-ocloc \
            intel-opencl-icd \
            libmfx-gen1 \
            libva-glx2 \
            libvpl2 \
            libvpl-tools \
            libze1 \
            libze-dev \
            libze-intel-gpu1 \
            va-driver-all \
            vainfo

      # Install xpu (important!) and dev dependencies (they include tests' deps plus extras for CI).
      - name: Install Torch Tweak
        working-directory: torch-tweak
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          uv sync --extra xpu --extra dev

      - name: Run unit tests and library doctests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          # Uses [tool.pytest.ini_options] testpaths and --doctest-modules from pyproject.toml.
          uv run coverage run -m pytest -v -m "not functional and not nightly"

      - name: Run functional tests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          uv run coverage run -m pytest -m functional

      # Examples call their console scripts' modules directly, so coverage.py can wrap them.
      - name: Run examples
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        working-directory: torch-tweak
        run: |
          echo "::group::minimal"
          uv run coverage run examples/Minimal/demo.py
          echo "::endgroup::"

          echo "::group::llm"
          cd examples/LLM
          uv sync --group coverage
          uv run coverage run -m llm.tune --model_id microsoft/Phi-3-mini-4k-instruct
          uv run coverage run -m llm.benchmark --model_id microsoft/Phi-3-mini-4k-instruct --sequence_lengths "128,1024"
          cd -
          echo "::endgroup::"

          echo "::group::e5large"
          cd examples/E5Large
          uv sync --group coverage
          uv run coverage run -m e5large.tune
          uv run coverage run -m e5large.inference --prompt "query: What is the capital city of France?"
          cd -
          echo "::endgroup::"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: torch-tweak/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Debug CI platform information
        if: ${{ always() }}
        run: ./torch-tweak/.github/scripts/get_system_info.sh
