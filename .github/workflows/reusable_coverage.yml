name: Coverage

# Combines the coverage data uploaded by reusable_tests_gpu.yml and reusable_tests_cpu.yml,
# compares it with main and updates the badge on push.

on:
  workflow_call:
    inputs:
      event_name:
        description: Event that triggered the caller workflow
        required: true
        type: string
      pull_request_base_sha:
        description: Base commit SHA for pull request coverage
        required: false
        type: string
    secrets:
      BB_GIST_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      # Needed to find and download the baseline report from the latest successful run on main.
      actions: read

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs the PR base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data*
          merge-multiple: true
          path: coverage-data

      # Only coverage and diff-cover from uv.lock; the project itself and torch are not needed here.
      - name: Install coverage tools
        run: uv sync --locked --only-group coverage

      - name: Combine coverage data and build reports
        run: |
          uv run --no-sync coverage combine coverage-data/
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage html -d htmlcov
          uv run --no-sync coverage report --skip-covered --sort=cover

      # On main this artifact becomes the baseline for subsequent PRs.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            htmlcov/
          retention-days: 90

      - name: Download baseline coverage from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs that skipped GPU tests (no relevant changes) have no report, so take the newest one that does.
          # Runs are listed under the caller workflow (ci.yml).
          found=false
          while read -r run_id head_sha; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage-report --dir baseline; then
              echo "label=main @ ${head_sha:0:7}" >> "$GITHUB_OUTPUT"
              found=true
              break
            fi
          done < <(gh run list \
            --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
            --limit 20 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"' || true)
          if [ "$found" != true ]; then
            echo "::warning title=Coverage::No baseline coverage report found on main"
          fi

      - name: Measure coverage of changed lines
        if: inputs.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ inputs.pull_request_base_sha }}
        run: |
          uv run --no-sync diff-cover coverage.xml \
            --compare-branch "$BASE_SHA" \
            --include 'torch_tweak/**' \
            --format json:diff-cover.json,markdown:diff-cover.md

      # Threshold to fail PR if total line coverage drops by: 5%
      - name: Publish coverage summary
        id: summary
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          FAIL_THRESHOLD_PARAM: ${{ inputs.event_name == 'pull_request' && '--fail-threshold 5' || '' }}
        run: |
          python .github/scripts/coverage_summary.py \
            --current coverage.json \
            --baseline baseline/coverage.json \
            --baseline-label "${BASELINE_LABEL:-main}" \
            --diff-cover diff-cover.json \
            --diff-cover-markdown diff-cover.md \
            ${FAIL_THRESHOLD_PARAM}

          # Export value of the code coverage %, rounded up to 2 decimal places
          export COV_OUT=$(python -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2))')
          echo "calculated coverage=${COV_OUT}\%"
          echo "COV_OUT=$COV_OUT" >> $GITHUB_OUTPUT

      # Only update the badge on push (event is passed only for total coverage)
      - name: Update coverage badge
        if: ${{ success() && inputs.event_name == 'push' }}
        uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.BB_GIST_TOKEN }}
          gistID: cfa745c6e219d84dec39841a981daea7
          filename: tt_coverage_badge.svg
          label: Coverage
          message: ${{ steps.summary.outputs.COV_OUT }}%
          valColorRange: ${{ steps.summary.outputs.COV_OUT }}
          minColorRange: 50 # if <= this value = color: red
          maxColorRange: 90 # if >= this value = color: green
