name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &tests-paths
      - "torch_tweak/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "conftest.py"
      - "uv.lock"
      - ".github/workflows/tests.yml"
      - ".github/scripts/coverage_summary.py"
  pull_request:
    paths: *tests-paths

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  tests:
    name: Tests
    needs: lint
    runs-on: [BMG]
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak'
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: >-
        --device=/dev/dri
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
    env:
      # Shared by tests and examples (which run in their own venvs), so all data lands in one place.
      COVERAGE_RCFILE: ${{ github.workspace }}/torch-tweak/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/torch-tweak/.coverage

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install drivers and required packages
        run: |
          # extra proxy inherited to docker has to be removed
          unset no_proxy
          unset NO_PROXY

          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:kobuk-team/intel-graphics
          apt-get update -y
          apt-get install -y \
            build-essential \
            clinfo \
            git \
            hwinfo \
            intel-gsc \
            intel-media-va-driver-non-free \
            intel-metrics-discovery \
            intel-ocloc \
            intel-opencl-icd \
            libmfx-gen1 \
            libva-glx2 \
            libvpl2 \
            libvpl-tools \
            libze1 \
            libze-dev \
            libze-intel-gpu1 \
            va-driver-all \
            vainfo

      # Install xpu (important!) and dev dependencies (they include tests' deps plus extras for CI).
      - name: Install Torch Tweak
        working-directory: torch-tweak
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

          uv sync --extra xpu --extra dev

      - name: Run unit tests and library doctests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          # Uses [tool.pytest.ini_options] testpaths and --doctest-modules from pyproject.toml.
          uv run coverage run -m pytest -v -m "not functional and not nightly"

      - name: Run functional tests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          uv run coverage run -m pytest -m functional

      # Examples call their console scripts' modules directly, so coverage.py can wrap them.
      - name: Run examples
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        working-directory: torch-tweak
        run: |
          echo "::group::minimal"
          uv run coverage run examples/Minimal/demo.py
          echo "::endgroup::"

          echo "::group::llm"
          cd examples/LLM
          uv sync --group coverage
          uv run --group coverage coverage run -m llm.tune --model_id microsoft/Phi-3-mini-4k-instruct
          uv run --group coverage coverage run -m llm.benchmark --model_id microsoft/Phi-3-mini-4k-instruct --sequence_lengths "128,1024"
          cd -
          echo "::endgroup::"

          echo "::group::e5large"
          cd examples/E5Large
          uv sync --group coverage
          uv run --group coverage coverage run -m e5large.tune
          uv run --group coverage coverage run -m e5large.inference --prompt "query: What is the capital city of France?"
          cd -
          echo "::endgroup::"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: torch-tweak/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Debug CI platform information
        if: ${{ always() }}
        run: ./torch-tweak/.github/scripts/get_system_info.sh

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to find and download the baseline report from the latest successful run on main.
      actions: read

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs the PR base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage-data

      # Only coverage and diff-cover from uv.lock; the project itself and torch are not needed here.
      - name: Install coverage tools
        run: uv sync --locked --only-group coverage

      - name: Combine coverage data and build reports
        run: |
          uv run --no-sync coverage combine coverage-data/
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage html -d htmlcov
          uv run --no-sync coverage report --skip-covered --sort=cover

      # On main this artifact becomes the baseline for subsequent PRs.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            htmlcov/
          retention-days: 90

      - name: Download baseline coverage from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run_id head_sha < <(gh run list \
            --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push --status success \
            --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"') || true
          if [ -n "${run_id:-}" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name coverage-report --dir baseline; then
            echo "label=main @ ${head_sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Coverage::No baseline coverage report found on main"
          fi

      - name: Measure coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-sync diff-cover coverage.xml \
            --compare-branch "$BASE_SHA" \
            --include 'torch_tweak/**' \
            --format json:diff-cover.json,markdown:diff-cover.md

      # Threshold to fail PR if total line coverage drops by: 5%
      - name: Publish coverage summary
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          FAIL_THRESHOLD_PARAM: ${{ github.event_name == 'pull_request' && '--fail-threshold 5' || '' }}
        run: |
          python .github/scripts/coverage_summary.py \
            --current coverage.json \
            --baseline baseline/coverage.json \
            --baseline-label "${BASELINE_LABEL:-main}" \
            --diff-cover diff-cover.json \
            --diff-cover-markdown diff-cover.md \
            ${FAIL_THRESHOLD_PARAM}
