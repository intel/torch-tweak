name: Nightly Tests

# Runs long-running nightly tests on GPU configuration
# and self-hosted runner health check. It also runs extra checks
# that are not required on per-PR runs.

on:
  schedule:
    - cron: "0 22 * * 1-5"  # 22:00 UTC, Monday-Friday
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  # This group incl. PR, because we test this workflow from time to time on PR.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extra-checks:
    name: Extra checks
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        id: trivy-filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: ${{ runner.temp }}/trivy-filesystem.json
          exit-code: "0"
          version: v0.76.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Resolve runtime dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/tt-sca"
          uv pip compile --extra xpu --extra dev pyproject.toml \
            -o "$RUNNER_TEMP/tt-sca/requirements.txt"

      - name: Scan resolved dependencies with Trivy
        id: trivy-dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/tt-sca
          scanners: vuln
          format: json
          list-all-pkgs: "true"
          output: ${{ runner.temp }}/trivy-dependencies.json
          exit-code: "0"
          version: v0.76.2
          skip-setup-trivy: true

      - name: Upload Trivy reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: |
            ${{ runner.temp }}/trivy-filesystem.json
            ${{ runner.temp }}/trivy-dependencies.json
            ${{ runner.temp }}/tt-sca/requirements.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on high or critical findings
        if: ${{ !cancelled() && steps.trivy-filesystem.outcome == 'success' && steps.trivy-dependencies.outcome == 'success' }}
        run: |
          jq -s '[.[].Results[]? | .Target as $target
                  | ((.Vulnerabilities // [])[] | {target: $target, id: .VulnerabilityID, pkg: .PkgName,
                                                   version: .InstalledVersion, severity: .Severity}),
                    ((.Secrets // [])[] | {target: $target, id: .RuleID, severity: .Severity})
                  | select(.severity == "HIGH" or .severity == "CRITICAL")]' \
            "$RUNNER_TEMP/trivy-filesystem.json" "$RUNNER_TEMP/trivy-dependencies.json" > "$RUNNER_TEMP/trivy-blocking.json"
          jq -r '.[] | [.severity, .id, .target, .pkg // "-", .version // "-"] | @tsv' "$RUNNER_TEMP/trivy-blocking.json"
          jq -e 'length == 0' "$RUNNER_TEMP/trivy-blocking.json" > /dev/null

  semgrep:
    name: Semgrep Scan
    runs-on: [BMG]
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak'
    container: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci --code --secrets

  nightly:
    name: Long Tests/Examples
    runs-on: [BMG]
    # run only on upstream; forks won't have the HW
    if: github.repository == 'intel/torch-tweak'
    container:
      image: ubuntu:26.04
      options: >-
        --device=/dev/dri
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
    env:
      # OpenVINO on XPU needs OpenCL on Level Zero, which Battlemage enables only with EnableLEO=1.
      EnableLEO: "1"

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak

      - name: Install drivers and required packages
        run: |
          # extra proxy inherited to docker has to be removed
          unset no_proxy
          unset NO_PROXY

          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:kobuk-team/intel-graphics
          apt-get update -y
          apt-get install -y \
            build-essential \
            clinfo \
            git \
            hwinfo \
            intel-gsc \
            intel-media-va-driver-non-free \
            intel-metrics-discovery \
            intel-ocloc \
            intel-opencl-icd \
            libmfx-gen1 \
            libva-glx2 \
            libvpl2 \
            libvpl-tools \
            libze1 \
            libze-dev \
            libze-intel-gpu1 \
            python3 \
            python3-pip \
            python3-venv \
            va-driver-all \
            vainfo

      - name: Create venv
        run: |
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      # Install xpu (important!) and dev dependencies (they include tests' deps plus extras for CI).
      - name: Install Torch Tweak
        working-directory: torch-tweak
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          python3 -m pip install \
            --index-url https://download.pytorch.org/whl/xpu \
            --extra-index-url https://pypi.org/simple \
            -e ".[xpu,dev]"

      - name: Run functional tests
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
          TORCH_TWEAK_TESTS_LOG_LEVEL: DEBUG
        working-directory: torch-tweak
        run: |
          python3 -m pytest -m nightly

      - name: Run examples
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        working-directory: torch-tweak
        run: |
          echo "::group::resnet"

          cd examples/ResNet
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"
          echo "::group::ParakeetCTC"

          cd examples/ParakeetCTC
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"
          echo "::group::ParakeetRNNT"

          cd examples/ParakeetRNNT
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"
          echo "::group::ESM2"

          cd examples/ESM2
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"
          echo "::group::flux"

          cd examples/FLUX
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"
          echo "::group::llm_all"

          python3 -m pip install \
            --index-url https://download.pytorch.org/whl/xpu \
            --extra-index-url https://pypi.org/simple \
            ./examples/LLM
          cd examples/LLM
          benchmark-all --model_id microsoft/Phi-3-mini-4k-instruct
          cd -

          echo "::endgroup::"
          echo "::group::stable_diffusion"

          cd examples/StableDiffusion
          uv sync
          uv run tune
          uv run inference
          cd -

          echo "::endgroup::"

      - name: Debug CI platform information
        if: ${{ always() }}
        run: ./torch-tweak/.github/scripts/get_system_info.sh
