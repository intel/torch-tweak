name: Lint

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &lint-paths
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths: *lint-paths

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1

      - name: Install pre-commit (among other dev deps)
        run: uv sync --extra dev --no-default-groups --no-install-project

      - name: Check tool version pins
        run: |
          # Make sure the ruff version pinned in pyproject.toml matches the one in .pre-commit-config.yaml
          ruff_pin=$(python3 -c 'import pathlib,re; m=re.search(r"ruff==([0-9.]+)", pathlib.Path("pyproject.toml").read_text()); print(m.group(1) if m else "")')
          ruff_rev=$(python3 -c 'import pathlib,re; m=re.search(r"astral-sh/ruff-pre-commit.*?rev:\s*v(\S+)", pathlib.Path(".pre-commit-config.yaml").read_text(), re.S); print(m.group(1) if m else "")')
          if [ -z "$ruff_pin" ] || [ "$ruff_pin" != "$ruff_rev" ]; then
            echo "ruff pin '${ruff_pin:-missing}' != pre-commit rev '${ruff_rev:-missing}'"
            exit 1
          fi

      - name: Run pre-commit
        env:
          # Branch guard; irrelevant when validating files in CI (e.g. push to main).
          SKIP: no-commit-to-branch
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            uv run pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
          else
            uv run pre-commit run --all-files --show-diff-on-failure
          fi
