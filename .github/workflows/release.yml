name: Release

# Publishes the torch-tweak core distributions to PyPI and TestPyPI.
#
# Only release tags are allowed, e.g. v0.5.0 or v0.5.0rc1.
#
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

# Never cancel a release midway: a partial upload cannot be redone with the
# same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Require a tagged commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow on a release tag."
            exit 1
          fi
          if ! printf '%s' "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            echo "::error::Tag '${REF_NAME}' does not match vX.Y.Z or vX.Y.ZrcN."
            exit 1
          fi

      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${REF_NAME}' points to ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

  # Note: packaging.yml also builds the example wheels, which are never
  # published, so a broken example blocks the release.
  build:
    name: Build
    needs: validate-tag
    uses: ./.github/workflows/packaging.yml

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: >-
        ${{ inputs.target == 'pypi'
          && format('https://pypi.org/project/torch-tweak/{0}/', steps.version.outputs.version)
          || format('https://test.pypi.org/project/torch-tweak/{0}/', steps.version.outputs.version) }}
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) and attestation signing
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/core/

      - name: Require the built version to match the tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          expected="$(printf '%s\n' \
            "torch_tweak-${version}-py3-none-any.whl" \
            "torch_tweak-${version}.tar.gz" | sort)"
          actual="$(ls dist/core | sort)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::dist/core does not match version ${version}."
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish to ${{ inputs.target }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          packages-dir: dist/core/
          repository-url: >-
            ${{ inputs.target == 'pypi'
              && 'https://upload.pypi.org/legacy/'
              || 'https://test.pypi.org/legacy/' }}

  # Installs the published wheel and runs the minimal example on an Intel GPU.
  verify:
    name: Verify package from ${{ inputs.target }}
    needs: publish
    runs-on: [BMG]
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
      options: >-
        --device=/dev/dri
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}

    steps:
      - name: Remove leftovers from previous runs
        run: rm -rf dist published

      # Only the scripts, so nothing can import torch_tweak from sources.
      - name: Checkout the check scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-tweak
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check_installed_package.py
            examples/Minimal/demo.py
          sparse-checkout-cone-mode: false

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/core/

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install drivers and required packages
        run: |
          # extra proxy inherited to docker has to be removed
          unset no_proxy
          unset NO_PROXY

          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:kobuk-team/intel-graphics
          apt-get update -y
          apt-get install -y \
            clinfo \
            intel-gsc \
            intel-media-va-driver-non-free \
            intel-metrics-discovery \
            intel-ocloc \
            intel-opencl-icd \
            libmfx-gen1 \
            libva-glx2 \
            libvpl2 \
            libvpl-tools \
            libze1 \
            libze-intel-gpu1 \
            va-driver-all \
            vainfo

      # The index needs a few minutes to serve a freshly uploaded version.
      - name: Download the wheel from ${{ inputs.target }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          INDEX_URL: >-
            ${{ inputs.target == 'pypi'
              && 'https://pypi.org/simple'
              || 'https://test.pypi.org/simple' }}
        run: |
          for attempt in $(seq 1 20); do
            if python -m pip download --no-deps --no-cache-dir \
                --index-url "${INDEX_URL}" --dest published/ \
                "torch-tweak==${VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "::error::torch-tweak ${VERSION} is not available on ${INDEX_URL}."
              exit 1
            fi
            sleep 30
          done

      - name: Require the downloaded wheel to match the built one
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          wheel="torch_tweak-${VERSION}-py3-none-any.whl"
          built="$(sha256sum "dist/core/${wheel}" | cut -d' ' -f1)"
          published="$(sha256sum "published/${wheel}" | cut -d' ' -f1)"
          if [ "${built}" != "${published}" ]; then
            echo "::error::${wheel} on the index differs from the built artifact."
            exit 1
          fi

      # Dependencies come from the real indexes, never from TestPyPI.
      - name: Install the wheel with the XPU extra
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/xpu \
            --extra-index-url https://pypi.org/simple \
            "./published/torch_tweak-${VERSION}-py3-none-any.whl[xpu]"
          /tmp/venv/bin/pip list

      - name: Check the installed package and XPU support
        working-directory: /tmp
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        run: >-
          /tmp/venv/bin/python
          "${GITHUB_WORKSPACE}/torch-tweak/.github/scripts/check_installed_package.py"
          --version "${VERSION}"

      - name: Run the minimal example
        working-directory: /tmp
        env:
          ONEAPI_DEVICE_SELECTOR: level_zero:gpu
        run: /tmp/venv/bin/python "${GITHUB_WORKSPACE}/torch-tweak/examples/Minimal/demo.py"
