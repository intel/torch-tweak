name: Deploy docs

# Deploy documentation to GitHub Pages.
# - push to main: deploys the "main" version.
# - push of a final release tag (vX.Y.Z): deploys version X.Y.Z.
#   Release candidates (vX.Y.ZrcN) are not deployed.
# The version selector offers "main" and every released version.
# The strict docs build is checked in reusable_checks.yml (per PR).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "torch_tweak/**"
      - "docs/**"
      - "examples/**/README.md"
      - "scripts/stage_docs.py"
      - "properdocs.yml"
      - "ChangeLog.md"
      - "LICENSE"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy_docs.yml"

# Serialize all deployments to gh-pages and keep every queued release tag (up to GitHub's queue limit).
concurrency:
  group: docs-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deploys with mike instead of actions/deploy-pages to keep versioned docs (one
  # directory per version on the gh-pages branch, with a version selector).
  # mike pushes to gh-pages, so this job needs contents: write.
  deploy-docs:
    name: Deploy docs
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a final release tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${REF_NAME}' does not match vX.Y.Z."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.sha || 'refs/heads/main' }}
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' points to ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install doc dependencies
        run: uv sync --no-default-groups --extra doc

      - name: Deploy docs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GIT_COMMITTER_NAME: ${{ secrets.GH_BB_DOCKER_USERNAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GH_BB_DOCKER_USERNAME }}@users.noreply.github.com
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            uv run --no-default-groups --extra doc mike deploy --push "${REF_NAME#v}"
          else
            uv run --no-default-groups --extra doc mike deploy --push main
          fi
