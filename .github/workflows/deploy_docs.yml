name: Deploy docs

# Deploy documentation to GitHub Pages.
# The strict docs build is checked in reusable_checks.yml (per PR).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "torch_tweak/**"
      - "docs/**"
      - "examples/**/README.md"
      - "scripts/stage_docs.py"
      - "properdocs.yml"
      - "ChangeLog.md"
      - "LICENSE"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy_docs.yml"

# A running deploy is never cancelled; only the newest waiting run is kept, which is fine as each deploys main's HEAD.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deploys with mike instead of actions/deploy-pages to keep versioned docs (one
  # directory per version on the gh-pages branch, with a version selector).
  # mike pushes to gh-pages, so this job needs contents: write.
  deploy-docs:
    name: Deploy docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # TODO: Change back to "3.x" once openvino releases 3.15 version
      # ref. https://github.com/openvinotoolkit/openvino/issues/38721
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install doc dependencies
        run: uv sync --no-default-groups --extra doc

      - name: Deploy docs
        env:
          GIT_COMMITTER_NAME: ${{ secrets.GH_BB_DOCKER_USERNAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GH_BB_DOCKER_USERNAME }}@users.noreply.github.com
        run: uv run --no-default-groups --extra doc mike deploy --push main
