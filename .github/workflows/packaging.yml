name: Packaging

# Builds every distribution the repository can produce and checks that each one
# carries the Apache-2.0 license text and the upstream attribution notices,
# identical to the canonical copies at the repository root.
# Build backends stay silent when those files go missing, so the artifacts are
# inspected explicitly.
#
# Also called by release.yml, which publishes the core distributions from the
# uploaded "dist" artifact.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &packaging-paths
      - "LICENSE"
      - "third-party-programs.txt"
      - "pyproject.toml"
      - "examples/*/pyproject.toml"
      - "examples/*/LICENSE"
      - "examples/*/third-party-programs.txt"
      - ".github/scripts/check_dist_licenses.py"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths: *packaging-paths

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
      ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Torch Tweak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The core package version is derived from the git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keeping this pinned, so we have stable release environment
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1

      # Hatchling packs untracked files that are not gitignored.
      - name: Require a clean worktree
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            printf '%s\n' "${dirty}"
            exit 1
          fi

      - name: Build core distributions
        run: uv build --out-dir dist/core

      # Example license-file symlinks point to the repository root, so build
      # their wheels directly from the checkout rather than through an sdist.
      - name: Build example wheels
        run: |
          for example in examples/*/pyproject.toml; do
            uv build --wheel "$(dirname "${example}")" --out-dir dist/examples
          done

      - name: Verify license files in all distributions
        run: python3 .github/scripts/check_dist_licenses.py dist/core/* dist/examples/*.whl

      - name: Upload core distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/core/
          if-no-files-found: error
