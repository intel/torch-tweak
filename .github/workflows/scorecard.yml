# Scorecard analysis, looking for vulnerabilities and bad practices in the repo.
name: Scorecard

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    # Runs at 01:00 UTC on Saturday.
    - cron: '0 1 * * 6'
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: read

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Run analysis
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: scorecard_results.sarif
        results_format: sarif
        publish_results: true

    # Upload the results as artifacts to the repository Actions tab.
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
      with:
        name: Scorecard results
        path: scorecard_results.sarif
        retention-days: 7

    # Upload the results to GitHub's code scanning dashboard.
    - name: Upload to code-scanning
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: scorecard_results.sarif
