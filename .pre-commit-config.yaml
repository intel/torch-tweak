repos:
  - repo: local
    hooks:
      - id: fix-copyright-headers
        name: fix missing SPDX copyright headers
        entry: python3 .github/scripts/check_licenses.py --fix
        language: system
        files: '\.(py|md|html|yaml|yml|toml|ini|cfg)$'

        pass_filenames: true
      - id: regenerate-uv-lock
        name: regenerate uv.lock
        entry: uv lock
        language: system
        files: 'pyproject.toml'
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev equal to the ruff pin in pyproject.toml. Lint fails when they differ.
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [ --fix ]
        types_or: [ python, pyi ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: '^tests/(toy_backends\.py|toy_models/|utilities/)'
      - id: no-commit-to-branch
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        exclude: 'setup.cfg|tests/assets/reports/.*\.txt'
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
    - id: check-dependabot
    - id: check-github-workflows

  # Strip output from Jupyter and IPython notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Skip B101 (assert_used): assertions are expected in tests; all other checks run.
        args: ["-s", "B101", "-x", "/.venv/"]
