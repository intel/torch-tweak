[project]
name = "torch-tweak"
readme = "README.md"
description = "Torch Tweak is an inference toolkit designed for tuning and deploying Deep Learning models with a focus on Intel XPU (GPU) accelerators."
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]
license = "Apache-2.0"
license-files = ["LICENSE", "third-party-programs.txt"]
authors = [{ name = "Intel Corporation" }]
maintainers = [{ name = "Intel Corporation" }]
keywords = [
    "inference",
    "tune",
    "intel",
    "openvino",
    "pytorch",
    "torch",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2",
    "openvino>=2026.2.1",
    "psutil",
    "tabulate>=0.10.0",
    "torchao>=0.17.0",
    "wrapt~=2.2"
]

[project.urls]
"Documentation" = "https://github.com/intel/torch-tweak"
"Repository" = "https://github.com/intel/torch-tweak.git"
"Tracker" = "https://github.com/intel/torch-tweak/issues"

[project.optional-dependencies]
xpu = [
    "torch>=2.13.0",
    "fsspec>=2026.6.0", # sec
]
test = [
    "datasets>=4.8.5,<6.0.0",
    "diffusers>=0.40.0,<1.0",
    "fsspec>=2026.6.0", # sec
    "multidict>=6.9.1", # sec
    "pytest>=9.1.1",
    "pytest-mock",
    "pillow>=12.3.0",
    "pyarrow>=24.0.0", # sec
    "sentencepiece>=0.2.1",
    "timm",
    "transformers>=5.13.0,<6",
    "urllib3>=2.7.0", # sec
]
doc = [
    "mike >= 2.2.0",
    "mkdocs-htmlproofer-plugin >= 1.5.0",
    "mkdocs-material >= 9.7.6",
    "mkdocs-redirects >= 1.2.3",
    "mkdocstrings[python] >= 1.0.4",
    "mkdocstrings-python >= 2.0.5",
    "properdocs >= 1.6.7",
    # Keep this pin equal to the ruff-pre-commit rev. Lint fails when they differ.
    "ruff==0.17.1",
]
dev = [
    "torch-tweak[test]",
    "torch-tweak[doc]",
    "pre-commit",
    "pre-commit-uv",
    "uv>=0.11.26",
    "virtualenv>=21.7.13", # sec
]

[build-system]
requires = [
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0",
    "setuptools>=83.0.0"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["torch_tweak"]

# hatch-vcs wraps setuptools_scm, so raw-options are passed through to it verbatim.
#
# We're dropping here a specific git version, when building. Now, instead of a version like
# "torch_tweak==0.1.dev1+g7c6ac7b94", we're getting "torch_tweak==0.1.dev1".
# This is mostly to solve the CI issue, when there's unexpected git dirty state.
#
# We could bring more accurate version, using local, private scheme, but this can fail in some scenarios...?
# Ref. https://github.com/pypa/setuptools-scm/issues/1084
[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version", fallback_version = "0.4.0" }

[dependency-groups]
xpu-nightly = ["torch>=2.13.0", "triton-xpu"]
xpu-stable = ["torch>=2.13.0"]

[tool.uv]
managed = true
index-strategy = "unsafe-best-match"
default-groups = ["xpu-stable"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
    [{ group = "xpu-nightly" }, { group = "xpu-stable" }],
    [{ group = "xpu-nightly" }, { extra = "xpu" }],
]

[[tool.uv.index]]
name = "pytorch-xpu-nightly"
url = "https://download.pytorch.org/whl/nightly/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu-nightly", group = "xpu-nightly" },
    { index = "pytorch-xpu", group = "xpu-stable" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchao = { index = "pytorch-cpu" }
triton-xpu = [
    { index = "pytorch-xpu-nightly", group = "xpu-nightly" },
]

# Pytest's live log level can be overriden with --log-cli-level=DEBUG
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = ["--import-mode=importlib", "--doctest-modules"]
pythonpath = ["."]
testpaths = ["torch_tweak", "tests/unit", "tests/functional"]
markers = [
    "functional: mark test as a functional test",
    "nightly: mark test to be run in nightly workflow",
]

[tool.ruff]
preview = true
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "C4",
    "C90",
    "D",
    "E",
    "F",
    "I",
    "N",
    "W",
    "T",
    "T10",
    "T20",
    "UP",
    "CPY",
    "G004"
]
ignore = ["E266", "E501", "N818"]
exclude = ["**/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"**/__version__.py" = ["D100"]
"**/{tests,docs,tools,examples}/*" = ["C416", "D", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
