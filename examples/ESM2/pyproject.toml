[project]
name = "torch-tweak-esm2-example"
dynamic = ["version"]
description = "Torch Tweak ESM2 Example"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "torch-tweak[xpu]",
    "transformers>=5.10.0,<6",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.5",
    "colored",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch_tweak = { path = "../../" }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "esm2.tune:tune"
inference = "esm2.infer:infer"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esm2"]

# LICENSE and third-party-programs.txt are kept only at the repository root and
# pulled in at build time, so distributions must be built with `uv build --wheel`.
#
# The target directory below has to spell out name and version, because hatchling
# does not expand placeholders here. Update it whenever either one changes: a stale
# name silently produces a second .dist-info directory, which the packaging workflow
# rejects.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "torch_tweak_esm2_example-0.1.0.dist-info/licenses/LICENSE"
"../../third-party-programs.txt" = "torch_tweak_esm2_example-0.1.0.dist-info/licenses/third-party-programs.txt"
