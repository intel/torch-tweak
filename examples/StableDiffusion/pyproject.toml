[project]
name = "torch-tweak-stable-diffusion-example"
dynamic = ["version"]
description = "Torch Tweak Stable Diffusion example"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "torch_tweak",
    "diffusers>=0.40.0,<1.0",
    "torch>=2.13.0",
    "transformers>=5.10.0,<6",
    "pillow>=12.3.0",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.5",
]

[dependency-groups]
xpu-nightly = ["torch>=2.13.0", "triton-xpu"]
xpu-stable = ["torch>=2.13.0", "triton-xpu"]

[tool.uv]
managed = true
index-strategy = "unsafe-best-match"
default-groups = ["xpu-stable"]
conflicts = [
    [{ group = "xpu-nightly" }, { group = "xpu-stable" }],
]

[[tool.uv.index]]
name = "pytorch-xpu-nightly"
url = "https://download.pytorch.org/whl/nightly/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch_tweak = { path = "../../" }
torch = [
    { index = "pytorch-xpu-nightly", group = "xpu-nightly" },
    { index = "pytorch-xpu", group = "xpu-stable" },
]
triton-xpu = [
    { index = "pytorch-xpu-nightly", group = "xpu-nightly" },
    { index = "pytorch-xpu", group = "xpu-stable" },
]
torchao = { index = "pytorch-cpu" }

[project.scripts]
tune = "stable_diffusion.tune:main"
inference = "stable_diffusion.inference:main"
benchmark-hybrid = "stable_diffusion.benchmark_hybrid:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stable_diffusion"]

# LICENSE and third-party-programs.txt are kept only at the repository root and
# pulled in at build time, so distributions must be built with `uv build --wheel`.
#
# The target directory below has to spell out name and version, because hatchling
# does not expand placeholders here. Update it whenever either one changes: a stale
# name silently produces a second .dist-info directory, which the packaging workflow
# rejects.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "torch_tweak_stable_diffusion_example-0.1.0.dist-info/licenses/LICENSE"
"../../third-party-programs.txt" = "torch_tweak_stable_diffusion_example-0.1.0.dist-info/licenses/third-party-programs.txt"
