[project]
name = "torch-tweak-flux-example"
dynamic = ["version"]
description = "Torch Tweak FLUX.2-klein-4B Example"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third-party-programs.txt"]
requires-python = ">=3.10"

dependencies = [
    "torch_tweak",
    "diffusers>=0.38.0,<=0.41.0",
    "torch>=2.13.0",
    "transformers>=5.10.0,<6",
    "pillow>=12.3.0",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.5",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch_tweak = { path = "../../" }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "flux.tune:main"
inference = "flux.inference:main"

[build-system]
requires = ["setuptools>=83.0.0", "setuptools_scm[toml]>=10.2.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"
fallback_version = "0.4.0"

[tool.setuptools.packages.find]
namespaces = false
include = ["flux"]

[tool.setuptools.package-data]
flux = ["**/*"]
