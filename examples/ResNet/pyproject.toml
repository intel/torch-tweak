[project]
name = "torch-tweak-resnet-example"
dynamic = ["version"]
description = "Torch Tweak ResNet Example"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch-tweak[xpu]",
    "torch>=2.13.0",
    "torchvision",
    "timm",
    "pillow>=12.3.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch_tweak = { path = "../../" }
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "resnet.tune:main"
inference = "resnet.inference:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resnet"]

# LICENSE and third-party-programs.txt are kept only at the repository root and
# pulled in at build time, so distributions must be built with `uv build --wheel`.
#
# The target directory below has to spell out name and version, because hatchling
# does not expand placeholders here. Update it whenever either one changes: a stale
# name silently produces a second .dist-info directory, which the packaging workflow
# rejects.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "torch_tweak_resnet_example-0.1.0.dist-info/licenses/LICENSE"
"../../third-party-programs.txt" = "torch_tweak_resnet_example-0.1.0.dist-info/licenses/third-party-programs.txt"
