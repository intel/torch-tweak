[project]
name = "torch-tweak-parakeet-ctc-example"
dynamic = ["version"]
description = "Torch Tweak Parakeet CTC Example"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third-party-programs.txt"]
requires-python = ">=3.10"

dependencies = [
    "torch-tweak[xpu]",
    "megatron-core",
    "nemo-toolkit[asr]>=3.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    "hydra-core>=1.3.4", #sec
    "lightning>=2.6.6", #sec
]
constraint-dependencies = [
    "fsspec>=2026.6.0", #sec
    "multidict>=6.9.1", #sec
    "werkzeug>=3.1.9", #sec
]

[tool.uv.sources]
torch_tweak = { path  = "../../" }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "parakeet_ctc.tune:main"
inference = "parakeet_ctc.inference:main"
patch-nv-one-logger = "parakeet_ctc.patch_nv_one_logger:main"

[build-system]
requires = ["setuptools>=83.0.0", "setuptools_scm[toml]>=10.2.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"
fallback_version = "0.4.0"

[tool.setuptools.packages.find]
namespaces = false
include = ["parakeet_ctc"]

[tool.setuptools.package-data]
parakeet_ctc = ["**/*"]
