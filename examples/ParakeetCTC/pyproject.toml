[project]
name = "torch-tweak-parakeet-ctc-example"
dynamic = ["version"]
description = "Torch Tweak Parakeet CTC Example"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "torch-tweak[xpu]",
    "megatron-core",
    "nemo-toolkit[asr]>=3.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    "hydra-core>=1.3.4", #sec
    "lightning>=2.6.6", #sec
]
constraint-dependencies = [
    "fsspec>=2026.6.0", #sec
    "multidict>=6.9.1", #sec
    "werkzeug>=3.1.9", #sec
]

[tool.uv.sources]
torch_tweak = { path  = "../../" }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "parakeet_ctc.tune:main"
inference = "parakeet_ctc.inference:main"
patch-nv-one-logger = "parakeet_ctc.patch_nv_one_logger:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parakeet_ctc"]

# LICENSE and third-party-programs.txt are kept only at the repository root and
# pulled in at build time, so distributions must be built with `uv build --wheel`.
#
# The target directory below has to spell out name and version, because hatchling
# does not expand placeholders here. Update it whenever either one changes: a stale
# name silently produces a second .dist-info directory, which the packaging workflow
# rejects.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "torch_tweak_parakeet_ctc_example-0.1.0.dist-info/licenses/LICENSE"
"../../third-party-programs.txt" = "torch_tweak_parakeet_ctc_example-0.1.0.dist-info/licenses/third-party-programs.txt"
