[project]
name = "torch-tweak-parakeet-ctc-example"
dynamic = ["version"]
description = "Torch Tweak Parakeet CTC Example"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third-party-programs.txt"]
requires-python = ">=3.11"

dependencies = [
    "torch-tweak[xpu]",
    "megatron-core",
    "nemo-toolkit[asr]>=3.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = [
    "hydra-core>=1.3.4", #sec
    "lightning>=2.6.6", #sec
]
constraint-dependencies = [
    "fsspec>=2026.6.0", #sec
    "multidict>=6.9.1", #sec
    "werkzeug>=3.1.9", #sec
]

[tool.uv.sources]
torch_tweak = { path  = "../../" }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "parakeet_ctc.tune:main"
inference = "parakeet_ctc.inference:main"
patch-nv-one-logger = "parakeet_ctc.patch_nv_one_logger:main"

[build-system]
requires = [
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0",
    "setuptools>=83.0.0"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parakeet_ctc"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", local_scheme = "no-local-version", fallback_version = "0.4.0" }
